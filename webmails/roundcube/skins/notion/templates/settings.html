<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" />

<h1 class="voice"><roundcube:label name="preferences" /></h1>

<!-- notion: prototype layout - the main categories and the section list
     are two columns of the SAME middle pane, not an extra sidebar -->
<div id="layout-list" class="listbox selected" aria-labelledby="aria-label-prefsection">
	<div class="header">
		<span id="aria-label-prefsection" class="header-title"><roundcube:label name="settings" /></span>
	</div>
	<div class="scroller settings-cols">
		<ul id="settings-menu" class="listing iconized settings-default-icon settings-cat">
			<roundcube:object name="settingstabs" class="listitem" tagname="li" />
			<roundcube:container name="tabs" id="settings-menu" />
		</ul>
		<roundcube:object name="sectionslist" id="sections-table" class="listing iconized settings-default-icon settings-sub"
			noheader="true" role="listbox" data-list="sections_list" />
	</div>
</div>

<div id="layout-content" role="main">
	<div class="header">
		<a class="button icon back-list-button" href="#back"><span class="inner"><roundcube:label name="back" /></span></a>
		<span class="header-title"></span>
	</div>
	<div class="iframe-wrapper">
		<roundcube:object name="contentframe" id="preferences-frame" src="env:blankpage" title="arialabelpreferencesform" />
	</div>
</div>

<roundcube:include file="includes/footer.html" />
